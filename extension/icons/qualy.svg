<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="qbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3a4e"/>
      <stop offset="1" stop-color="#1b2531"/>
    </linearGradient>
    <linearGradient id="qpin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb43d"/>
      <stop offset="1" stop-color="#ff9900"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="2" y="2" width="124" height="124" rx="30" fill="url(#qbg)"/>

  <!-- winding route -->
  <path d="M30 100 C 46 100, 44 74, 62 74 S 84 74, 86 52"
        fill="none" stroke="#ff9900" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="1.5 13" opacity="0.9"/>
  <circle cx="30" cy="100" r="7" fill="#ff9900"/>
  <circle cx="30" cy="100" r="3" fill="#1b2531"/>

  <!-- location pin -->
  <path d="M86 22
           a24 24 0 0 1 24 24
           c0 18 -24 42 -24 42
           c0 0 -24 -24 -24 -42
           a24 24 0 0 1 24 -24 Z"
        fill="url(#qpin)"/>
  <!-- check inside pin -->
  <path d="M75 46 l8 8 l16 -17" fill="none" stroke="#1b2531"
        stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
